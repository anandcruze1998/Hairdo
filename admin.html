<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control Panel - Hairdo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-6">
            <h1 class="text-xl font-bold tracking-tight">Hairdo Admin</h1>
            <p class="text-xs text-gray-400 mt-1">Master Control Panel</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="block px-4 py-2 bg-gray-800 rounded-md font-medium text-sm text-gray-100">Dashboard</a>
            <a href="/" class="block px-4 py-2 hover:bg-gray-800 rounded-md font-medium text-sm text-gray-400 transition-colors">Back to App</a>
        </nav>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500">
            &copy; 2026 Hairdo Platform
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-8 py-5 flex items-center justify-between">
            <h2 class="text-2xl font-semibold text-gray-800">Platform Overview</h2>
            <div class="flex items-center gap-4">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    System Online
                </span>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-8">
            <!-- Metrics Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-sm font-medium text-gray-500">Total Registered Salons</h3>
                    <p class="text-3xl font-bold text-gray-900 mt-2" id="metric-total-salons">-</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-sm font-medium text-gray-500">Active Listings</h3>
                    <p class="text-3xl font-bold text-gray-900 mt-2" id="metric-active-salons">-</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-sm font-medium text-gray-500">Total Platform Bookings</h3>
                    <p class="text-3xl font-bold text-gray-900 mt-2" id="metric-total-bookings">-</p>
                </div>
            </div>

            <!-- Management Section -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <!-- Left: Form -->
                <div class="xl:col-span-1 bg-white rounded-xl shadow-sm border border-gray-100 p-6 h-fit">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Onboard New Salon</h3>
                    <form id="onboarding-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Salon Name</label>
                            <input type="text" id="salon-name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                            <input type="text" id="salon-address" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                            <input type="text" id="salon-city" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contact Phone</label>
                            <input type="tel" id="salon-phone" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Operating Hours</label>
                            <input type="text" id="salon-hours" placeholder="e.g. 9 AM - 7 PM" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Services & Prices (Comma separated)</label>
                            <textarea id="salon-services" rows="2" placeholder="Haircut: $50, Coloring: $120" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"></textarea>
                        </div>
                        <div class="flex items-center mt-2">
                            <input type="checkbox" id="salon-active" checked class="h-4 w-4 text-gray-900 border-gray-300 rounded focus:ring-gray-900">
                            <label for="salon-active" class="ml-2 block text-sm text-gray-900">
                                Mark as Active immediately
                            </label>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-gray-900 text-white font-medium py-2.5 px-4 rounded-md hover:bg-gray-800 transition-colors mt-4">
                            Register Salon
                        </button>
                    </form>
                </div>

                <!-- Right: Table -->
                <div class="xl:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-900">Registered Salons Directory</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-500">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th scope="col" class="px-6 py-3">Salon Info</th>
                                    <th scope="col" class="px-6 py-3">Location</th>
                                    <th scope="col" class="px-6 py-3">Contact & Hours</th>
                                    <th scope="col" class="px-6 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="salons-table-body" class="divide-y divide-gray-100">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // CRITICAL CONFIGURATION: Embedded exact config block as requested
        const firebaseConfig = {
          apiKey: "AIzaSyDv9onZ4wyDPlg4VAgD_k6SfZJg01x2VpE",
          authDomain: "hairdo-e4b68.firebaseapp.com",
          projectId: "hairdo-e4b68",
          storageBucket: "hairdo-e4b68.firebasestorage.app",
          messagingSenderId: "124433891043",
          appId: "1:124433891043:web:0f771dfceafbd2dd1ccfd6",
          measurementId: "G-70STTW4Q7C"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const form = document.getElementById('onboarding-form');
        const submitBtn = document.getElementById('submit-btn');
        const tableBody = document.getElementById('salons-table-body');
        
        // Metrics Elements
        const metricTotal = document.getElementById('metric-total-salons');
        const metricActive = document.getElementById('metric-active-salons');
        const metricBookings = document.getElementById('metric-total-bookings');

        // State
        let salonsList = [];

        // Fetch Bookings (for metrics)
        const qBookings = query(collection(db, 'bookings'));
        onSnapshot(qBookings, (snapshot) => {
            metricBookings.innerText = snapshot.size;
        });

        // Fetch Salons
        const qSalons = query(collection(db, 'salons'));
        onSnapshot(qSalons, (snapshot) => {
            salonsList = [];
            let activeCount = 0;
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                salonsList.push({ id: doc.id, ...data });
                if(data.isActive) activeCount++;
            });

            // Update Metrics
            metricTotal.innerText = salonsList.length;
            metricActive.innerText = activeCount;

            renderTable();
        });

        function renderTable() {
            tableBody.innerHTML = '';
            
            if(salonsList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">No salons registered yet.</td></tr>`;
                return;
            }

            salonsList.forEach(salon => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                // Parse services for tooltip or abbreviated display
                let servicesText = "No services listed";
                if(salon.services && salon.services.length > 0) {
                    servicesText = salon.services.map(s => `${s.name}: $${s.price}`).join(', ');
                } else if(salon.servicesRaw) {
                    servicesText = salon.servicesRaw;
                }

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-semibold text-gray-900">${escapeHtml(salon.name)}</div>
                        <div class="text-xs text-gray-500 truncate w-48" title="${escapeHtml(servicesText)}">${escapeHtml(servicesText)}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-gray-900">${escapeHtml(salon.city || '')}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(salon.address || '')}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-gray-900">${escapeHtml(salon.contactPhone || salon.phone || '')}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(salon.operatingHours || salon.hours || '')}</div>
                    </td>
                    <td class="px-6 py-4">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer toggle-active" data-id="${salon.id}" ${salon.isActive ? 'checked' : ''}>
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-gray-900"></div>
                        </label>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            // Attach toggle listeners
            document.querySelectorAll('.toggle-active').forEach(toggle => {
                toggle.addEventListener('change', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const isActive = e.target.checked;
                    try {
                        const salonRef = doc(db, 'salons', id);
                        await updateDoc(salonRef, { isActive });
                    } catch (err) {
                        console.error('Error updating status:', err);
                        alert('Failed to update status. Check permissions.');
                        e.target.checked = !isActive; // revert
                    }
                });
            });
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnOriginalText = submitBtn.innerText;
            submitBtn.innerText = 'Registering...';
            submitBtn.disabled = true;

            const name = document.getElementById('salon-name').value;
            const address = document.getElementById('salon-address').value;
            const city = document.getElementById('salon-city').value;
            const contactPhone = document.getElementById('salon-phone').value;
            const operatingHours = document.getElementById('salon-hours').value;
            const isActive = document.getElementById('salon-active').checked;
            
            // Parse services
            const servicesRaw = document.getElementById('salon-services').value;
            const services = servicesRaw.split(',').map(s => {
                const parts = s.split(':');
                if(parts.length === 2) {
                    return { name: parts[0].trim(), price: parseFloat(parts[1].replace('$', '').trim()) || 0 };
                }
                return { name: s.trim(), price: 0 };
            });

            try {
                await addDoc(collection(db, 'salons'), {
                    name,
                    address,
                    city,
                    contactPhone,
                    operatingHours,
                    isActive,
                    services,
                    servicesRaw,
                    createdAt: Date.now()
                });

                form.reset();
                document.getElementById('salon-active').checked = true; // reset default
            } catch (err) {
                console.error("Error adding salon:", err);
                alert("Failed to add salon: " + err.message);
            } finally {
                submitBtn.innerText = btnOriginalText;
                submitBtn.disabled = false;
            }
        });

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
